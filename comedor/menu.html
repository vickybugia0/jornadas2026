<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inicio</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<div class="sidebar">
    <h2>🌿 App</h2>
    <a href="menu.html">🏠 Inicio</a>
    <a href="usuarios.html">👤 Usuarios</a>
    <a href="#" onclick="logout()">🚪 Salir</a>
</div>

<div class="main">

<div id="usuarioLogueado"></div>

<div class="navbar">Inicio</div>

<div class="container">
<div class="card">
    <h2>Bienvenido 👋</h2>
</div>
</div>

</div>

<script>
let usuario = localStorage.getItem("usuarioActivo");

if (!usuario) {
    window.location.href = "index.html";
} else {
    document.getElementById("usuarioLogueado").textContent =
        "Usuario: " + usuario;
}

function logout() {
    localStorage.removeItem("usuarioActivo");
    window.location.href = "index.html";
}
</script>

</body>
</html>
