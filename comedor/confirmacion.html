<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Confirmación</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<div class="navbar">
    ✔ Pedido realizado
    <span id="usuarioActivo" style="margin-left:20px; font-size:0.9em; color:#fff;"></span>
</div>

<div class="container">

<div class="card">
    <h2>¡Pedido enviado con éxito!</h2>
    <p>Tu pedido fue registrado correctamente.</p>

    <a href="menu.html">
        <button>Volver al menú</button>
    </a>
</div>

</div>

<script>
window.onload = function() {
    mostrarUsuarioActivo();
};

function mostrarUsuarioActivo() {
    let usuarioActivo = localStorage.getItem("usuarioActivo");
    let elemento = document.getElementById("usuarioActivo");
    if (usuarioActivo && elemento) {
        elemento.textContent = "Usuario: " + usuarioActivo;
    } else if (elemento) {
        elemento.textContent = "";
    }
}
</script>

</body>
</html>
