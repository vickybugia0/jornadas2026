<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eliminar usuario</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<div class="navbar">Eliminar usuario</div>

<div class="container">

<div class="card">
    <h2>Eliminar usuario</h2>

    <input type="text" placeholder="Nombre del usuario">

    <button>Eliminar</button>
</div>

<a href="usuarios.html" class="volver">⬅ Volver</a>

</div>
<script>
window.onload = function() {
    mostrarUsuarioActivo();
};

function mostrarUsuarioActivo() {
    let usuarioActivo = localStorage.getItem("usuarioActivo");
    let elemento = document.getElementById("usuarioActivo");
    if (usuarioActivo && elemento) {
        elemento.textContent = "Usuario: " + usuarioActivo;
    } else if (elemento) {
        elemento.textContent = "";
    }
}
</script>

</body>
</html>
