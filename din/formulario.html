<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Personas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
            color: #444;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        input[type="submit"],
        input[type="reset"] {
            padding: 10px 20px;
            margin: 10px 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        input[type="submit"] {
            background: #4CAF50;
            color: white;
        }
        input[type="reset"] {
            background: #f44336;
            color: white;
        }
        input[type="submit"]:hover {
            background: #45a049;
        }
        input[type="reset"]:hover {
            background: #e53935;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Agregar Persona</h2>
        <form action="grabar.php" method="POST">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="fapellido" required>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="fnombre" required>

            <input type="submit" value="Agregar">
            <input type="reset" value="Limpiar">
        </form>
    </div>
</body>
</html>
